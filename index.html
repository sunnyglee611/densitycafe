<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나만의 밀도 카페</title><link rel="stylesheet" href="style.css"></head><body><header><h1>☕ 나만의 밀도 카페</h1><p>액체의 밀도를 비교하며 무지개 음료를 만들어 봐요</p></header><main><section class="workspace"><div class="glass-scene"><div class="glass" id="glass"><div class="layers" id="layers"></div></div><div class="hint">밀도가 큰 액체일수록 아래쪽에 놓여요</div></div><div class="actions"><button id="undo">↶ 한 단계 취소</button><button id="clear">↺ 다시 만들기</button></div></section><aside><h2>재료 선반</h2><p class="small">밀도는 수업용 근삿값(g/mL)입니다. 실제 값은 온도·농도에 따라 달라집니다.</p><div id="ingredients" class="ingredients"></div><h2>내 음료</h2><div id="recipe" class="recipe">재료를 골라 주세요.</div><label for="drinkName">음료 이름</label><input id="drinkName" placeholder="예: 무지개 밀도 라떼" maxlength="60"><label for="drinkIdea">음료 콘셉트</label><textarea id="drinkIdea" placeholder="예: 노을처럼 예쁘고 신비로운 색감"></textarea><button class="primary" id="generate">✨ AI 이미지·설명 생성</button><p class="small">AI 생성은 별도 API 서버와 Gemini API 키 설정 후 작동합니다. 브라우저에 API 키를 입력하지 마세요.</p><div id="result" aria-live="polite"></div></aside></main><footer>독립형 교육용 실험 시뮬레이션 · 실제 층 형성은 점성·혼합성·주입 방식에도 영향을 받습니다.</footer><script src="app.js"></script></body></html>
